# yaml-language-server: $schema=none

module_id: esmo_renal_cell_carcinoma_advanced_metastatic
source_guideline:
  organization: ESMO
  year: 2024
  doi: 10.1016/j.annonc.2024.05.537
  available_online: '2024-05-22'
status: synthetic_cases_for_technical_validation
cases:
- id: advanced_eligibility_supported
  description: Histologically confirmed active metastatic RCC.
  rule_file: eligibility.yaml
  facts:
    guideline_temporal_applicability: applicable
    cancer_type: renal_cell_carcinoma
    diagnosis_confirmed: 'yes'
    histopathology_confirmed: 'yes'
    disease_setting: metastatic_active
  expected:
    rule_id: ESMO-RCC-ADV-ELIG-001
    status: applicable
    audit_effect: none
- id: advanced_eligibility_missing_setting
  description: Disease setting is missing.
  rule_file: eligibility.yaml
