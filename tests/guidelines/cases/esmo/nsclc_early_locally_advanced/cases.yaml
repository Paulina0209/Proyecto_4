# yaml-language-server: $schema=none

module_id: esmo_nsclc_early_locally_advanced
source_guideline:
  organization: ESMO
  year: 2025
  doi: 10.1016/j.annonc.2025.08.003
  publication_date: '2025-08-28'
status: synthetic_cases_for_technical_validation
cases:
- id: neo_perioperative_pembrolizumab_supported
  description: NSCLC resecable estadio IIIA, EGFR WT y ALK negativo, en fase neoadyuvante.
  rule_file: neoadjuvant.yaml
  facts:
    guideline_temporal_applicability: applicable
    treatment_phase: neoadjuvant
    resectability_status: resectable
    clinical_stage_group: IIIA
    egfr_status: wild_type
    alk_status: negative
    biomarker_testing_complete: 'yes'
    mdt_review_completed: 'yes'
    immunotherapy_contraindication: 'no'
    cisplatin_eligible: 'yes'
    prescribed_antineoplastic_drugs:
    - pembrolizumab
    - cisplatin
    - pemetrexed
  expected:
    rule_id: ESMO-NSCLC-ELA-NEO-001
    status: applicable
    audit_effect: supports_prescription
- id: perioperative_continuation_after_surgery_supported
  description: Continuación posoperatoria de la secuencia perioperatoria.
  rule_file: perioperative.yaml
  facts:
    guideline_temporal_applicability: applicable
    pembrolizumab_pathway: perioperative
    prior_neoadjuvant_pembrolizumab: 'yes'
    prior_neoadjuvant_platinum_chemotherapy: 'yes'
    surgery_completed: 'yes'
    disease_progression: 'no'
    immunotherapy_contraindication: 'no'
    prescribed_antineoplastic_drugs:
    - pembrolizumab
  expected:
    rule_id: ESMO-NSCLC-ELA-PERI-001
    status: applicable
    audit_effect: supports_prescription
- id: adjuvant_continuation_after_neoadjuvant_supported
  description: Pembrolizumab adyuvante después de pembrolizumab y platino neoadyuvantes.
  rule_file: adjuvant.yaml
  facts:
    guideline_temporal_applicability: applicable
    treatment_phase: adjuvant
    pembrolizumab_pathway: perioperative
    prior_neoadjuvant_pembrolizumab: 'yes'
    prior_neoadjuvant_platinum_chemotherapy: 'yes'
    surgery_completed: 'yes'
    disease_progression: 'no'
    immunotherapy_contraindication: 'no'
    prescribed_antineoplastic_drugs:
    - pembrolizumab
  expected:
    rule_id: ESMO-NSCLC-ELA-ADJ-001
    status: applicable
    audit_effect: supports_prescription
- id: adjuvant_only_after_platinum_supported_pdl1_zero
  description: Pembrolizumab adyuvante después de resección R0 y platino, con PD-L1
    0%.
  rule_file: adjuvant.yaml
  facts:
    guideline_temporal_applicability: applicable
    treatment_phase: adjuvant
    pembrolizumab_pathway: adjuvant_only
    surgery_completed: 'yes'
    resection_margin_status: R0
    pathological_stage_group: IIIA
    tumor_size_cm: 5.2
    egfr_status: wild_type
    alk_status: negative
    prior_neoadjuvant_pembrolizumab: 'no'
    prior_adjuvant_platinum_chemotherapy: 'yes'
    disease_progression: 'no'
    immunotherapy_contraindication: 'no'
    pdl1_test_completed: 'yes'
    pdl1_tc_percent: 0
    prescribed_antineoplastic_drugs:
    - pembrolizumab
  expected:
    rule_id: ESMO-NSCLC-ELA-ADJ-002
    status: applicable
    audit_effect: supports_prescription
- id: pcr_does_not_automatically_justify_adjuvant_omission
  description: Omisión adyuvante basada únicamente en respuesta patológica completa.
  rule_file: perioperative.yaml
  facts:
    guideline_temporal_applicability: applicable
    prior_neoadjuvant_pembrolizumab: 'yes'
    surgery_completed: 'yes'
    pathologic_response: pCR
    adjuvant_pembrolizumab_planned: 'no'
  expected:
    rule_id: ESMO-NSCLC-ELA-PERI-002
    status: applicable
    audit_effect: requires_clinical_review
- id: historical_version_required_before_publication
