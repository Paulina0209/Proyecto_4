# Balanceador de carga (NFR-05): reparte las conexiones entre las réplicas de «app» sin abrir el TLS.
# El cifrado va de punta a punta (SEC-02): nginx solo reenvía bytes (módulo stream), no ve datos clínicos.
# Docker resuelve «app» a la IP de cada réplica; nginx vuelve a consultar cada 10 s, así que al escalar
# (docker compose up -d --scale app=N) las réplicas nuevas entran solas al reparto.
worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format conexiones '$remote_addr -> $upstream_addr [$time_local] $status $session_time s';
    access_log /dev/stdout conexiones;

    server {
        listen 8443;
        set $replicas app:8443;
        proxy_pass $replicas;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;          # el asistente responde en flujo: conexiones largas
    }
}
