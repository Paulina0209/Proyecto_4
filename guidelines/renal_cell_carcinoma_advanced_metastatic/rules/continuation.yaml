# yaml-language-server: $schema=none

rule_set_id: esmo_rcc_advanced_metastatic_continuation
status: draft_computable
rules:
- id: ESMO-RCC-ADV-CONT-001
  name: Consider cessation of immune checkpoint inhibitor after two years
  rule_origin: clinical_guideline
  conditions:
    all:
    - field: months_on_ici
      operator: greater_than_or_equal
      value: 24
    - field: prescribed_antineoplastic_drugs
      operator: contains
      value: pembrolizumab
  conclusion:
    action: review_ici_cessation
    recommendation_type: consider_cessation_after_two_years
    audit_effect: advisory
  evidence:
    organization: ESMO
    statement_scope: class_level
    native:
      evidence_level: IV
      recommendation_grade: B
      mcbs: null
    explicit_grade_reported: true
  source:
    guideline_id: esmo_renal_cell_carcinoma_2024
    section: First-line treatment for advanced and metastatic clear-cell RCC
    source_locator: PDF pp. 8 and 10 (journal pp. 699 and 701)
- id: ESMO-RCC-ADV-CONT-002
  name: Review imaging interval longer than four months during systemic therapy
  rule_origin: clinical_guideline
  conditions:
    all:
    - field: disease_setting
      operator: in
      value:
      - advanced_unresectable
      - metastatic_active
      - recurrent_metastatic
    - field: imaging_interval_months
      operator: greater_than
      value: 4
    - field: prescribed_antineoplastic_drugs
      operator: contains
      value: pembrolizumab
  conclusion:
    action: review_followup_interval
    recommendation_type: CT_every_two_to_four_months
    audit_effect: advisory
  evidence:
    organization: ESMO
    statement_scope: followup_recommendation
    native:
      evidence_level: IV
      recommendation_grade: B
      mcbs: null
    explicit_grade_reported: true
  source:
    guideline_id: esmo_renal_cell_carcinoma_2024
    section: Follow-up, long-term implications and survivorship
    source_locator: PDF pp. 11-12 (journal pp. 702-703)
- id: ESMO-RCC-ADV-CONT-003
  name: Continuation after documented progression requires expert review
  rule_origin: clinical_safety_boundary
  conditions:
    all:
    - field: disease_progression
      operator: equals
      value: 'yes'
    - field: prescribed_antineoplastic_drugs
      operator: contains
      value: pembrolizumab
  conclusion:
    action: flag_for_expert_review
    recommendation_type: progression_during_pd1_therapy
    audit_effect: requires_clinical_review
  evidence:
    organization: ESMO
    statement_scope: clinical_boundary
    native:
      evidence_level: null
      recommendation_grade: null
      mcbs: null
    explicit_grade_reported: false
  source:
    guideline_id: esmo_renal_cell_carcinoma_2024
    section: Follow-up and subsequent-line treatment
    source_locator: PDF pp. 8 and 11-12 (journal pp. 699 and 702-703)
  interpretation_note: RECIST-defined progression should be interpreted with clinical assessment; this rule does
    not mandate automatic discontinuation.
- id: ESMO-RCC-ADV-CONT-004
  name: Treatment interruption for toxicity requires clinical review
  rule_origin: clinical_safety_boundary
  conditions:
    all:
    - field: treatment_discontinuation_reason
      operator: equals
      value: toxicity
    - field: prescribed_antineoplastic_drugs
      operator: contains
      value: pembrolizumab
  conclusion:
    action: flag_for_expert_review
    recommendation_type: toxicity_management
    audit_effect: requires_clinical_review
  evidence:
    organization: ESMO
    statement_scope: clinical_boundary
    native:
      evidence_level: null
      recommendation_grade: null
      mcbs: null
    explicit_grade_reported: false
  source:
    guideline_id: esmo_renal_cell_carcinoma_2024
    section: Systemic treatment of advanced and metastatic RCC
    source_locator: PDF pp. 7-11 (journal pp. 698-702)
