# yaml-language-server: $schema=none

rule_set_id: esmo_rcc_advanced_metastatic_first_line
status: draft_computable
rules:
- id: ESMO-RCC-ADV-FL-001
  name: First-line pembrolizumab plus lenvatinib for advanced clear-cell RCC
  rule_origin: clinical_guideline
  conditions:
    all:
    - field: guideline_temporal_applicability
      operator: equals
      value: applicable
    - field: disease_setting
      operator: in
      value:
      - advanced_unresectable
      - metastatic_active
      - recurrent_metastatic
    - field: treatment_line
      operator: equals
      value: 1
    - field: rcc_histology
      operator: equals
      value: clear_cell
    - field: ici_suitability
      operator: equals
      value: eligible
    - field: prescribed_antineoplastic_drugs
      operator: contains_all
      value:
      - pembrolizumab
      - lenvatinib
  conclusion:
    action: support_regimen
    regimen_id: pembro_lenvatinib_first_line_ccrcc
    recommendation_type: recommended
    audit_effect: supports_prescription
  evidence:
    organization: ESMO
    statement_scope: drug_specific
    native:
      evidence_level: I
      recommendation_grade: A
      mcbs:
        version: '1.1'
        score: 4
    explicit_grade_reported: true
  source:
    guideline_id: esmo_renal_cell_carcinoma_2024
    section: First-line systemic treatment of advanced and metastatic RCC
    source_locator: PDF pp. 7-11 (journal pp. 698-702)
  interpretation_note: Recommended irrespective of IMDC risk group; no preference is established among recommended
    PD-1/VEGFR-TKI combinations.
