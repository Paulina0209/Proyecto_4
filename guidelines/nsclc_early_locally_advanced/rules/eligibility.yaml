      - locally_advanced
  conclusion:
    action: enter_module
    audit_effect: none
  evidence:
    organization: INTERNAL
    statement_scope: system_scope
    native: {}
    explicit_grade_reported: false
  source:
    source_type: system_scope
- id: ESMO-NSCLC-ELA-ELIG-002
  name: Evaluación sistémica preparada con biomarcadores y discusión multidisciplinaria
  rule_origin: clinical_guideline
  conditions:
    all:
    - field: guideline_temporal_applicability
      operator: equals
      value: applicable
    - field: biomarker_testing_complete
      operator: equals
      value: 'yes'
    - field: mdt_review_completed
      operator: equals
      value: 'yes'
  conclusion:
    action: proceed_to_systemic_pathway_evaluation
    recommendation_type: prerequisite_completed
    audit_effect: none
  evidence:
    organization: ESMO
    statement_scope: clinical_context
    native:
      evidence_level: V
      recommendation_grade: A
      mcbs: null
    explicit_grade_reported: true
  source:
    guideline_id: esmo_nsclc_early_locally_advanced_2025
