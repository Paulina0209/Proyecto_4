# yaml-language-server: $schema=none

rule_set_id: esmo_breast_metastatic_tnbc_eligibility
status: draft_computable_clinical_validation_pending
rules:
- id: ESMO-BREAST-M-TNBC-ELIG-001
  name: Metastatic or unresectable recurrent TNBC within module scope
  conditions:
    all:
    - field: cancer_type
      operator: equals
      value: breast
    - field: breast_subtype
      operator: equals
      value: triple_negative
    - field: disease_setting
      operator: in
      value:
      - metastatic
      - unresectable_recurrent
  conclusion:
    action: enter_module
    audit_effect: none
  evidence:
    organization: ESMO
    statement_scope: module_scope
    native:
      evidence_level: null
      recommendation_grade: null
      mcbs: null
    explicit_grade_reported: false
  source:
    title: 'ESMO Clinical Practice Guideline for the diagnosis, staging and treatment of patients with metastatic breast cancer'
    organization: ESMO
    publication_year: 2021
    doi: 10.1016/j.annonc.2021.09.019
    section: TNBC first-line treatment
