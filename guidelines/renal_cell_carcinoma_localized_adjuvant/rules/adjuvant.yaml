# yaml-language-server: $schema=none

rule_set_id: esmo_rcc_localized_adjuvant_adjuvant
status: draft_computable
rules:
- id: ESMO-RCC-LOC-ADJ-001
  name: Adjuvant pembrolizumab for pT2 grade 4 or sarcomatoid N0 M0 clear-cell RCC
  rule_origin: clinical_guideline
  conditions:
    all:
    - &id001
      field: guideline_temporal_applicability
      operator: equals
      value: applicable
    - &id002
      field: treatment_phase
      operator: equals
      value: adjuvant
    - &id003
      field: rcc_histology
      operator: equals
      value: clear_cell
    - &id004
      field: complete_resection
      operator: equals
      value: 'yes'
    - &id005
      field: no_evidence_of_disease
      operator: equals
      value: 'yes'
    - &id006
      field: weeks_since_complete_resection
      operator: less_than_or_equal
      value: 12
    - &id007
      field: ici_suitability
      operator: equals
      value: eligible
    - field: pathological_t_stage
      operator: equals
      value: pT2
    - any:
      - field: nuclear_grade
        operator: equals
        value: '4'
      - field: sarcomatoid_features
        operator: equals
        value: 'yes'
    - field: pathological_n_status
      operator: equals
      value: N0
    - field: metastatic_status
      operator: equals
      value: M0
  conclusion:
    action: support_regimen
    regimen_id: pembro_adjuvant_keynote564
    recommendation_type: should_be_considered
    audit_effect: supports_prescription
  evidence:
    organization: ESMO
    statement_scope: drug_specific
    native:
      evidence_level: I
      recommendation_grade: A
      mcbs: &id008
        version: '1.1'
        score: A
    explicit_grade_reported: true
  source:
    guideline_id: esmo_renal_cell_carcinoma_2024
    section: Adjuvant therapy in clear-cell RCC
    source_locator: PDF pp. 3-5 (journal pp. 694-696)
    figure: Figure 2
