- id: ESMO-RCC-LOC-ADJ-005
  name: Adjuvant pembrolizumab after complete resection of oligometastatic RCC rendered M1 NED
  rule_origin: clinical_guideline
  conditions:
    all:
    - field: guideline_temporal_applicability
      operator: equals
      value: applicable
    - field: treatment_phase
      operator: equals
      value: adjuvant
    - field: rcc_histology
      operator: equals
      value: clear_cell
    - field: disease_setting
      operator: equals
      value: M1_NED_post_metastasectomy
    - field: oligometastatic_disease
      operator: equals
      value: 'yes'
    - field: metastasectomy_completed
      operator: equals
      value: 'yes'
    - field: complete_resection
      operator: equals
      value: 'yes'
    - field: no_evidence_of_disease
      operator: equals
      value: 'yes'
    - field: metastatic_status
      operator: equals
      value: M1_NED
    - field: weeks_since_complete_resection
      operator: less_than_or_equal
      value: 12
    - field: ici_suitability
      operator: equals
      value: eligible
  conclusion:
    action: support_regimen
    regimen_id: pembro_adjuvant_M1_NED
    recommendation_type: can_be_offered
    audit_effect: supports_prescription
  evidence:
    organization: ESMO
    statement_scope: drug_specific
    native:
      evidence_level: II
      recommendation_grade: B
      mcbs:
        version: '1.1'
        score: A
    explicit_grade_reported: true
  source:
    guideline_id: esmo_renal_cell_carcinoma_2024
    section: Role of surgery and local therapy in advanced and metastatic ccRCC
    source_locator: PDF p. 10 (journal p. 701)
  interpretation_note: The case is historically metastatic but currently M1_NED; it is routed to the adjuvant module
    rather than active metastatic therapy.
