- id: ESMO-NSCLC-OA-ROUTE-010
  name: First-line pembrolizumab before an available driver-targeted strategy requires review
  conditions:
    all:
    - field: treatment_line
      operator: equals
      value: 1
    - field: driver_targeted_therapy_available
      operator: equals
      value: 'yes'
    - field: prior_driver_targeted_therapy
      operator: equals
      value: 'no'
    - field: prescribed_antineoplastic_drugs
      operator: contains
      value: pembrolizumab
  conclusion:
    action: flag_for_expert_review
    reason: driver_specific_first_line_strategy_not_addressed
    audit_effect: requires_clinical_review
  evidence:
    organization: ESMO
    statement_scope: cross_driver_synthesis
    native:
      evidence_level: null
      recommendation_grade: null
      mcbs: null
    explicit_grade_reported: false
    interpretation_note: Conservative routing safeguard; not an explicit universal anti-pembrolizumab grade.
  source: *id001
- id: ESMO-NSCLC-OA-ROUTE-011
  name: High PD-L1 does not bypass oncogenic-driver routing
  conditions:
    all:
    - field: pdl1_tps
      operator: greater_than_or_equal
      value: 50
    - field: molecular_pathway_status
      operator: equals
      value: oncogene_addicted
    - field: prescribed_antineoplastic_drugs
      operator: contains
      value: pembrolizumab
  conclusion:
    action: flag_for_expert_review
    reason: driver_status_precedes_non_oncogene_pdl1_algorithm
    audit_effect: requires_clinical_review
  evidence:
    organization: ESMO
    statement_scope: routing_safeguard
    native:
      evidence_level: null
      recommendation_grade: null
      mcbs: null
    explicit_grade_reported: false
  source: *id001
