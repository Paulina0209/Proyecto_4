# yaml-language-server: $schema=none

rule_set_id: esmo_nsclc_metastatic_oncogene_addicted_routing
status: draft_computable_clinical_validation_pending
rules:
- id: ESMO-NSCLC-OA-ROUTE-001
  name: Route EGFR-positive disease to driver-specific pathway
  conditions:
    field: actionable_driver_names
    operator: contains
    value: EGFR
  conclusion:
    action: route_to_driver_specific_pathway
    driver: EGFR
    audit_effect: none
  evidence:
    organization: ESMO
    statement_scope: driver_routing
    native:
      evidence_level: null
      recommendation_grade: null
      mcbs: null
    explicit_grade_reported: false
    interpretation_note: Summary routing rule; no universal ESMO evidence grade is assigned.
  source: &id001
    title: 'Oncogene-addicted metastatic non-small-cell lung cancer: ESMO Clinical Practice Guideline for diagnosis,
      treatment and follow-up'
    organization: ESMO
    publication_year: 2023
    doi: 10.1016/j.annonc.2022.12.009
    section: Biomarker-driven diagnosis and treatment algorithms
