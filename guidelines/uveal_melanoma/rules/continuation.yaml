# yaml-language-server: $schema=none

rule_set_id: esmo_uveal_melanoma_continuation
status: draft_computable_clinical_validation_pending
rules:
- id: ESMO-UVEAL-CONT-001
  name: Progression during pembrolizumab requires reassessment
  conditions:
    all:
    - field: disease_progression
      operator: equals
      value: 'yes'
    - field: prescribed_antineoplastic_drugs
      operator: contains
      value: pembrolizumab
  conclusion:
    action: flag_for_expert_review
    reason: progression_during_pembrolizumab
    audit_effect: requires_clinical_review
  evidence:
    organization: ESMO
    statement_scope: clinical_review_boundary
    native:
      evidence_level: null
      recommendation_grade: null
      mcbs: null
    explicit_grade_reported: false
  source: &id001
    title: 'Uveal melanoma: ESMO–EURACAN Clinical Practice Guideline for diagnosis, treatment and follow-up'
    organization: ESMO
    publication_year: 2026
    doi: 10.1016/j.esmoop.2026.106888
    section: Management of metastatic uveal melanoma
- id: ESMO-UVEAL-CONT-002
  name: Immune-related toxicity requires reassessment
  conditions:
    all:
    - field: immune_related_adverse_event
      operator: equals
      value: 'yes'
    - field: prescribed_antineoplastic_drugs
      operator: contains
      value: pembrolizumab
  conclusion:
    action: flag_for_expert_review
    reason: immune_related_toxicity
    audit_effect: requires_clinical_review
  evidence:
    organization: ESMO
    statement_scope: safety_boundary
    native:
      evidence_level: null
      recommendation_grade: null
      mcbs: null
    explicit_grade_reported: false
  source: *id001
