# Copiloto oncológico con Docker: preparar datos, N réplicas y un balanceador (NFR-05, escalabilidad horizontal).
#
#   docker compose up -d --build                  # https://localhost:8443  (dra.gomez / Demo-Clave-2026)
#   docker compose up -d --scale app=4            # más réplicas, sin detener el servicio
#   docker compose logs -f preparar               # la primera vez descarga la base de cBioPortal (unos minutos)
#   docker compose down                           # detiene; los datos quedan en los volúmenes
#
# Detalle en docs/docker.md.
name: copiloto

x-comun: &comun
  image: copiloto-oncologico:latest
  env_file:
    - path: .env              # llave de OpenAI y demás (no se sube a GitHub; ver .env.example)
      required: false
  volumes:
    - datos:/app/data
    - secretos:/secretos

services:
  # Corre una vez y termina: capas de datos de cBioPortal, escenario (usuarios, consentimientos, equipo,
  # órdenes de demostración), certificado, clave de cifrado e índice del asistente.
  preparar:
    <<: *comun
    build: .
    command: ["python", "-m", "frontend.real", "--solo-preparar"]
    restart: "no"
    healthcheck:
      disable: true

  # Las réplicas que atienden. Comparten datos y sesiones (volumen «datos»): cualquier réplica atiende a
  # cualquier usuario y una puede caer sin cerrar sesiones.
  app:
    <<: *comun
    build: .
    command: ["python", "-m", "frontend.real", "--sin-preparar"]
    environment:
      COPILOTO_WORKERS: ${COPILOTO_WORKERS:-2}
    deploy:
      replicas: ${COPILOTO_REPLICAS:-2}
    expose:
      - "8443"
    depends_on:
      preparar:
        condition: service_completed_successfully
    restart: unless-stopped

  # Única puerta de entrada: reparte las conexiones TLS entre las réplicas.
  balanceador:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${COPILOTO_PUERTO_PUBLICO:-8443}:8443"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos:       # bases SQLite, capa base de cBioPortal, documentos cifrados, índice, sesiones, certificado
  secretos:    # clave de cifrado en reposo (aparte: una copia de «datos» no se lleva la clave)
